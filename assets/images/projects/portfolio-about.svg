    <text x="144" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="#526B8A">01 · ABOUT ME</text>
    <text x="130" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.8" fill="#171717">Curious by nature.</text>
    <text x="130" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.8" fill="#171717">Building with purpose.</text>

    <text x="130" y="335" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6F757D">I'm an Information Technology student who learns best by making things.</text>
    <text x="130" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6F757D">I care about clean design, accessible interfaces, and code that's easy to</text>
    <text x="130" y="371" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6F757D">understand, maintain, and improve.</text>

