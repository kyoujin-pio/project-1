    <text x="172" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#404040">To grow into a web developer who builds useful, accessible</text>
    <text x="172" y="456" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#404040">digital experiences — and never stops learning.</text>

