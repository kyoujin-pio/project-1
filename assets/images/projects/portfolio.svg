    <text x="600" y="86" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#9AA3AD">piolo.dev</text>

    <rect x="100" y="104" width="1000" height="586" fill="#FFFFFF"/>
    <rect x="100" y="104" width="1000" height="586" fill="url(#glow)"/>

    <!-- Mini site navigation -->
