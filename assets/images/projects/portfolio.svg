      <circle cx="1057" cy="232" r="1.5" fill="#526B8A"/>
      <circle cx="1069" cy="232" r="1.5" fill="#526B8A"/>
      <circle cx="1045" cy="244" r="1.5" fill="#526B8A"/>
      <circle cx="1057" cy="244" r="1.5" fill="#526B8A"/>
      <circle cx="1069" cy="244" r="1.5" fill="#526B8A"/>
      <circle cx="1045" cy="256" r="1.5" fill="#526B8A"/>
      <circle cx="1057" cy="256" r="1.5" fill="#526B8A"/>
      <circle cx="1069" cy="256" r="1.5" fill="#526B8A"/>
    </g>

