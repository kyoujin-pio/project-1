    <text x="948" y="145" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="#FFFFFF">Let's talk</text>
    <line x1="140" y1="176" x2="1060" y2="176" stroke="#F0F1F3"/>

