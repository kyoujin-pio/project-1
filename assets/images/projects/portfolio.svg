    <rect x="738" y="199" width="300" height="364" rx="11" stroke="#526B8A" stroke-opacity="0.35"/>
    <rect x="726" y="187" width="300" height="364" rx="11" fill="#E8EDF2" stroke="#DDE3E9"/>
    <circle cx="876" cy="328" r="91" fill="#FFFFFF" fill-opacity="0.4"/>
    <circle cx="876" cy="337" r="56" fill="#B9C8D7"/>
    <path d="M772 526c4-71 47-113 104-113s100 42 104 113H772Z" fill="#A9BACA"/>
    <path d="M854 284c0-17 9-30 22-30s22 13 22 30" stroke="#8FA4B7" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="740" y="484" width="214" height="50" rx="7" fill="#FFFFFF" stroke="#E4E8ED"/>
    <rect x="752" y="496" width="26" height="26" rx="5" fill="#EEF2F7"/>
    <path d="M760 504h1.5l6.5 4 6.5-4H760ZM760 506v8h16v-8" stroke="#526B8A" stroke-width="1.1" stroke-linejoin="round"/>
    <text x="788" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="600" fill="#2C2C2E">Currently learning</text>
    <text x="788" y="520" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="7.5" fill="#8A9098">JavaScript &amp; UI/UX fundamentals</text>

    <g opacity="0.4">
