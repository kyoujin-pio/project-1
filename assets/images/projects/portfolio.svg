    <text x="153" y="146" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">P<tspan fill="#9CB5D0">.</tspan></text>
    <text x="176" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#171717">Piolo</text>

    <text x="684" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#8A9098">Home</text>
    <text x="731" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#8A9098">About</text>
    <text x="778" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#8A9098">Skills</text>
    <text x="826" y="144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#8A9098">Projects</text>
