    <circle cx="143" cy="228" r="3" fill="#526B8A"/>
    <text x="154" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="#526B8A">HELLO, I'M</text>
    <text x="136" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="77" font-weight="700" letter-spacing="-4.5" fill="#171717">Piolo<tspan fill="#526B8A">.</tspan></text>
    <text x="140" y="347" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#4B4B4F">Information Technology Student <tspan fill="#C4C9CF">/</tspan> Aspiring Web Developer</text>
    <text x="140" y="380" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#7B8189">I build clean, accessible web experiences and enjoy</text>
    <text x="140" y="397" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#7B8189">turning ideas into interfaces that feel simple to use.</text>

    <rect x="140" y="426" width="129" height="34" rx="5" fill="#171719"/>
    <text x="204" y="447" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="#FFFFFF">View my projects</text>
