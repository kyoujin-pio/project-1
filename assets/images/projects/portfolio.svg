    <line x1="140" y1="595" x2="1060" y2="595" stroke="#E7EAEE"/>
    <line x1="140" y1="652" x2="1060" y2="652" stroke="#E7EAEE"/>
    <text x="140" y="617" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.1" fill="#9AA0A8">STUDYING</text>
    <text x="140" y="635" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#33363A">BS Information Technology</text>
    <line x1="442" y1="607" x2="442" y2="640" stroke="#E7EAEE"/>
    <text x="468" y="617" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.1" fill="#9AA0A8">FOCUSED ON</text>
    <text x="468" y="635" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#33363A">Web development &amp; UI/UX</text>
    <line x1="763" y1="607" x2="763" y2="640" stroke="#E7EAEE"/>
    <text x="789" y="617" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.1" fill="#9AA0A8">CURRENTLY</text>
    <text x="789" y="635" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#33363A">Building projects &amp; learning in public</text>
  </g>

  <rect x="100.5" y="60.5" width="999" height="629" rx="17.5" stroke="#DEE3E8"/>
