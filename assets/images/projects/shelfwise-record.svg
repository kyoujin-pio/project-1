    <text x="736" y="576" font-family="Consolas, 'Courier New', monospace" font-size="7" fill="#9CB5D0">SELECT b.title, l.due_date</text>
    <text x="736" y="589" font-family="Consolas, 'Courier New', monospace" font-size="7" fill="#D6DFE8">FROM loans l</text>
    <text x="736" y="602" font-family="Consolas, 'Courier New', monospace" font-size="7" fill="#D6DFE8">JOIN books b ON b.book_id = l.book_id</text>
    <text x="736" y="615" font-family="Consolas, 'Courier New', monospace" font-size="7" fill="#D6DFE8">WHERE l.status = 'open';</text>
