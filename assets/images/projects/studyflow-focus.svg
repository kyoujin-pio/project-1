<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#D8DEE6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1A2230" flood-opacity="0.14"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="100" y="60" width="1000" height="630" rx="18"/>
    </clipPath>
    <linearGradient id="timerBg" x1="140" y1="220" x2="760" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2732"/>
      <stop offset="1" stop-color="#2B3947"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#EDF0F3"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect x="100" y="60" width="1000" height="630" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>

  <g clip-path="url(#windowClip)">
    <!-- Browser chrome -->
    <rect x="100" y="60" width="1000" height="44" fill="#F8F9FA"/>
    <line x1="100" y1="104" x2="1100" y2="104" stroke="#E7EAEE"/>
    <circle cx="128" cy="82" r="4" fill="#D7DCE2"/>
    <circle cx="146" cy="82" r="4" fill="#D7DCE2"/>
    <circle cx="164" cy="82" r="4" fill="#D7DCE2"/>
    <rect x="476" y="70" width="248" height="24" rx="6" fill="#FFFFFF" stroke="#E6E9ED"/>
    <path d="M489 83v-4a3 3 0 0 1 6 0v4" stroke="#A1ABB7" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="487" y="83" width="10" height="7" rx="1.5" fill="#A1ABB7"/>
    <text x="600" y="86" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#9AA3AD">studyflow.app/focus</text>

    <!-- App header -->
    <rect x="100" y="104" width="1000" height="64" fill="#FFFFFF"/>
    <line x1="100" y1="168" x2="1100" y2="168" stroke="#E9ECEF"/>
    <rect x="140" y="123" width="28" height="28" rx="7" fill="#526B8A"/>
    <path d="M149 134h10M149 139h7M149 144h10" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
    <text x="178" y="143" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="-0.2" fill="#171717">StudyFlow</text>
    <text x="330" y="142" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#8D939B">Board</text>
    <text x="381" y="142" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#8D939B">Calendar</text>
    <text x="443" y="142" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="500" fill="#526B8A">Focus</text>
    <rect x="441" y="153" width="26" height="2" rx="1" fill="#526B8A"/>
    <rect x="933" y="123" width="73" height="28" rx="5" fill="#F4F6F8"/>
    <text x="969" y="141" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="500" fill="#6F7680">Week 8</text>
    <rect x="1022" y="123" width="38" height="28" rx="5" fill="#171719"/>
    <circle cx="1041" cy="137" r="4" fill="#FFFFFF"/>
    <circle cx="1041" cy="137" r="1.8" fill="#171719"/>

    <rect x="100" y="168" width="1000" height="522" fill="#F7F8FA"/>

    <!-- Page heading -->
    <text x="140" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.7" fill="#171717">Focus mode</text>
    <text x="140" y="236" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#848B94">One task at a time. The rest can wait.</text>
    <rect x="951" y="199" width="109" height="26" rx="5" fill="#FFFFFF" stroke="#E2E6EB"/>
    <path d="m962 212 4-4 4 4M966 208v9" stroke="#737A84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="977" y="215" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#737A84">Back to board</text>

    <!-- Focus timer card -->
    <rect x="140" y="262" width="600" height="392" rx="14" fill="url(#timerBg)"/>
    <circle cx="440" cy="440" r="122" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="10"/>
    <circle cx="440" cy="440" r="122" stroke="#9CB5D0" stroke-width="10" stroke-linecap="round" stroke-dasharray="498 268" transform="rotate(-90 440 440)"/>
    <circle cx="440" cy="440" r="104" fill="#FFFFFF" fill-opacity="0.035"/>

    <text x="440" y="315" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1.6" fill="#A8BCD0">FOCUS SESSION</text>
    <text x="440" y="390" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-2" fill="#FFFFFF">18:42</text>
    <text x="440" y="420" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#B6C2CF">Database chapter review</text>
    <text x="440" y="438" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#7F92A6">Session 2 of 3 · 25 minutes</text>

    <rect x="354" y="466" width="82" height="32" rx="6" fill="#FFFFFF"/>
    <rect x="368" y="477" width="5" height="10" rx="1.5" fill="#171717"/>
    <rect x="377" y="477" width="5" height="10" rx="1.5" fill="#171717"/>
    <text x="409" y="487" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="600" fill="#171717">Pause</text>
    <rect x="446" y="466" width="82" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <text x="487" y="487" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="500" fill="#E3E9EF">End session</text>

    <text x="440" y="538" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#7F92A6">Keep this tab open. Notifications are paused.</text>

    <!-- Right sidebar -->
    <rect x="760" y="262" width="300" height="392" rx="12" fill="#FFFFFF" stroke="#E4E8ED"/>
    <text x="782" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#171717">Today's plan</text>
    <text x="1038" y="292" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#8A9098">3 of 6 done</text>

    <rect x="782" y="306" width="256" height="5" rx="2.5" fill="#EDEFF2"/>
    <rect x="782" y="306" width="128" height="5" rx="2.5" fill="#526B8A"/>

    <!-- Tasks -->
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
      <circle cx="791" cy="342" r="7" fill="#2F8F63"/>
      <path d="m788 342 2 2 4-4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="346" font-size="9.5" fill="#8A9098" text-decoration="line-through">Review database notes</text>
      <text x="807" y="360" font-size="7.5" fill="#A4AAB2">Completed · 25 min</text>

      <circle cx="791" cy="390" r="7" fill="#2F8F63"/>
      <path d="m788 390 2 2 4-4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="394" font-size="9.5" fill="#8A9098" text-decoration="line-through">Read accessibility chapter</text>
      <text x="807" y="408" font-size="7.5" fill="#A4AAB2">Completed · 30 min</text>

      <rect x="784" y="426" width="248" height="62" rx="7" fill="#EEF2F7"/>
      <circle cx="800" cy="447" r="7" stroke="#526B8A" stroke-width="1.4"/>
      <circle cx="800" cy="447" r="2.5" fill="#526B8A"/>
      <text x="815" y="444" font-size="9.5" font-weight="600" fill="#26262A">Database chapter review</text>
      <text x="815" y="458" font-size="7.5" fill="#6F7680">In progress · 25 min</text>
      <rect x="815" y="468" width="86" height="4" rx="2" fill="#D8E1EA"/>
      <rect x="815" y="468" width="52" height="4" rx="2" fill="#526B8A"/>

      <circle cx="791" cy="515" r="7" stroke="#B6BEC7" stroke-width="1.2"/>
      <text x="807" y="519" font-size="9.5" fill="#404040">Sketch portfolio layout</text>
      <text x="807" y="533" font-size="7.5" fill="#9AA0A8">Later today · 30 min</text>

      <circle cx="791" cy="563" r="7" stroke="#B6BEC7" stroke-width="1.2"/>
      <text x="807" y="567" font-size="9.5" fill="#404040">Write project reflection</text>
      <text x="807" y="581" font-size="7.5" fill="#9AA0A8">Tomorrow · 20 min</text>
    </g>

    <rect x="782" y="604" width="256" height="30" rx="6" fill="#F8F9FA" stroke="#E4E8ED" stroke-dasharray="4 4"/>
    <text x="910" y="623" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#9AA0A8">+ Add a task</text>
  </g>

  <rect x="100.5" y="60.5" width="999" height="629" rx="17.5" stroke="#DEE3E8"/>
</svg>
